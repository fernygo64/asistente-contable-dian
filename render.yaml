services:
  - type: web
    name: asistente-contable-dian
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /salud
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: asistente-contable-db
          property: connectionString

databases:
  - name: asistente-contable-db
    plan: free
